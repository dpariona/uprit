<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablas con celdas combinadas</title>
</head>
<body>
    <h1>Tablas con celdas combinadas</h1>
    <h2>Tabla con columnas combinadas</h2>
    <p>El atributo colspan permite unir celdas de una misma fila.</p>
    <table border="1">
        <tr>
            <td colspan="2">11</td>
            <td>12</td>
            <td>13</td>
        </tr>
        <tr>
            <td colspan="2">20</td>
            <td>21</td>
            <td>22</td>
        </tr>
        <tr>
            <td>31</td>
            <td colspan="2">Dos celdas</td>
            <td>33</td>
        </tr>
    </table>
    <h2>Tabla con filas combinadas</h2>
    <p>El atributo rowspan permite unir celdas de una misma columna.</p>
    <table border="1">
        <tr>
            <td rowspan="2">Dos celdas</td>
            <td>12</td>
            <td>13</td>
        </tr>
        <tr>
            <td>22</td>
            <td>23</td>
        </tr>
        <tr>
            <td>31</td>
            <td>32</td>
            <td>33</td>
        </tr>
    </table>
        <br>
        <p><a href="index.html">VOLVER</a></p>
</body>
</html>

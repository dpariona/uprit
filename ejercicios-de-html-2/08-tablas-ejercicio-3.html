<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablas divididas</title>
</head>
<body>
    <table border="1">
        <tr>
            <td>a1</td><td>a2</td><td>a3</td><td>a4</td>
        </tr>
    </table>
    <br>
    <table border="1">
        <tr>
            <td>b1</td>
            <td rowspan="2" colspan="2">central</td>
            <td>b4</td>
        </tr>
        <tr>
            <td>c1</td>
            <td>c4</td>
        </tr>
    </table>
    <br>
    <table border="1">
        <tr>
            <td>d1</td><td>d2</td><td>d3</td><td>d4</td>
        </tr>
    </table>
	<h2>una sola tabla con las divisiones indicadas</h2>

	<hr>

<table border="1" >
    <tr>
        <td>a1</td>
        <td>a2</td>
        <td>a3</td>
        <td>a4</td>
    </tr>
    <tr>
        <td colspan="4">Fila 2 unida</td>
    </tr>
    <tr>
        <td>b1</td>
        <td rowspan="2" colspan="2">central</td>
        <td>b4</td>
    </tr>
    <tr>
        <td>c1</td>
        <td>c4</td>
    </tr>
    <tr>
        <td colspan="4">Fila 5 unida</td>
    </tr>
    <tr>
        <td>d1</td>
        <td>d2</td>
        <td>d3</td>
        <td>d4</td>
    </tr>
</table>

</body>
</html>

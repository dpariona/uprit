<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formatos de texto</title>
    <style>
        body {
            background-color: #efe3f4;
            color: #48245b;
            font-family: Arial;
            margin: 30px;
        }
        .contenido {
	background-color: #fffaf0;
	padding: 20px;
        }
        p, li { font-size: 17px; }
        .resaltado { background-color: yellow; }
    </style>
</head>
<body>
    <div class="contenido">
        <p><strong><span class="resaltado">Texto en negrita y resaltado</span></strong></p>
        <hr>
        <p>Ecuación de segundo grado: ax<sup>2</sup> + bx + c = 0</p>
        <hr>
        <p>Algunas siglas que se utilizan al aprender páginas web:</p>
        <ul>
            <li><abbr title="HyperText Markup Language">HTML</abbr> (<em>HyperText Markup Language</em>)</li>
            <li><abbr title="World Wide Web Consortium">W3C</abbr> (<em>World Wide Web Consortium</em>)</li>
        </ul>
       </p>
    </div>
</body>
</html>

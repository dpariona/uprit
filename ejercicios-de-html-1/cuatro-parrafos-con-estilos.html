        body {

        p {
            color:blue;

    <p class="centrado">En octubre celebramos al <span class="rojo">Señor</span> de los Milagros.</p>

    <h3 class="derecha">El color <span class="rojo">morado</span> nos recuerda la unión y la fe.</h3>
    <p class="centrado plata">Compartir con respeto es una forma de vivir esta celebración.</p>
